[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpf2-mcp"
version = "0.1.0"
description = "Transport Fever 2 MCP bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TPF2 线路运行图</title>
    <link rel="stylesheet" href="timetable.css?v=20260912-ui-structure1">
</head>

<body>
    <header>
        <div class="brand"><b>TPF2</b> // CTC DISPATCH</div>
        <div class="title">线路循环运行图</div>
        <div class="spacer"></div>
        <div class="mode">SHADOW PLAN · 禁止自动执行</div>
    </header>
    <div class="workspace">
        <nav>
            <button id="network-view">站场图</button>
            <button class="active">运行图</button>
            <button>线路</button>
            <button>车辆</button>
            <button>告警</button>
            <button>设置</button>
        </nav>
        <section class="list">
            <div class="panel">
                <h3>线路模板</h3>
                <div id="summary">载入中…</div>
            </div>
            <div class="panel detail-panel">
                <h3>当前线路</h3>
                <div class="info" id="info">请选择线路</div>
            </div>
            <div class="line-list" id="lines"></div>
        </section>
        <main class="chart">
            <svg id="diagram" viewBox="0 0 1200 720"></svg>
        </main>
    </div>
    <footer id="footer">一条线路一套表；同线车辆仅占用不同相位。</footer>
    <div id="rail-map-templates" data-template-files="templates/timetable.html" hidden aria-hidden="true"></div>
    <script src="vendor/jquery-4.0.0.min.js"></script>
    <script src="template-runtime.js?v=20260912-template-extraction1"></script>
    <script src="timetable-page.js?v=20260912-ui-structure1"></script>
    <script src="timetable.js?v=20260912-template-extraction1"></script>
</body>

</html>
